name: Deploy til Cloudflare

# Deployer public/ til Workeren "tjekditfly" ved hvert push til main.
# Kræver ét secret i GitHub-repoet: CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens →
# Create Token → skabelonen "Edit Cloudflare Workers"). Konto-id'et er ikke hemmeligt.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fuld historik. build-pages.mjs sætter hver fast sides dateModified ud fra
          # `git log -1 -- <fil>`, og i en shallow clone peger det på HEAD for alle filer.
          # Med depth 1 blev alle sider derfor stemplet med dagens dato ved hvert deploy.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Byg og test sitet
        run: bash build.sh

      - name: Deploy med wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0051ca795dd4f6896515a9cc051d1e77
          # Action'en installerer selv wrangler 3.90 som standard, og den version kender
          # ikke assets-only Workers: den leder efter et `main`-felt, som med vilje ikke
          # findes her, og fejler med "Missing entry-point". Wrangler 4 skal til.
          wranglerVersion: "4.137.0"
          command: deploy
